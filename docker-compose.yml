# Optional local setup: a pgvector-enabled Postgres for development without Neon.
# The project runs on a hosted Neon Postgres by default (DATABASE_URL in .env); Docker is not
# required. To use this instead, set
#   DATABASE_URL=postgresql://aiwealth:<POSTGRES_PASSWORD>@localhost:5432/aiwealth
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiwealth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiwealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiwealth}
      POSTGRES_DB: ${POSTGRES_DB:-aiwealth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
