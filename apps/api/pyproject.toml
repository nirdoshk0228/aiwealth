[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwealth-api"
version = "0.1.0"
description = "AIWealth API: portfolio risk analytics, optimization, goal planning and AI assistant."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    # Phase 2 data layer
    "httpx",       # HTTP client for mfapi.in (timeouts; MockTransport for offline tests)
    "numpy",
    "pandas",      # time-series alignment and returns
    "pyarrow",     # Parquet cache
    "yfinance",    # NSE stocks (.NS) and Nifty 50 (^NSEI)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
