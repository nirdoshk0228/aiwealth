[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwealth-api"
version = "0.1.0"
description = "AIWealth API: portfolio risk analytics, optimization, goal planning and AI assistant."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    # Phase 2 data layer
    "httpx",       # HTTP client for mfapi.in (timeouts; MockTransport for offline tests)
    "numpy",
    "pandas",      # time-series alignment and returns
    "pyarrow",     # Parquet cache
    "yfinance",    # NSE stocks (.NS) and Nifty 50 (^NSEI)
    # Phase 4 API layer
    "sqlalchemy>=2",      # ORM; Postgres in dev/prod, SQLite in unit tests
    "psycopg[binary]>=3", # Postgres driver (binary wheel: no libpq build needed)
    "alembic",            # schema migrations
    "pgvector",           # SQLAlchemy Vector type for pgvector (Phase 8 embeddings)
    "pyjwt",              # JWT access tokens (passwords use stdlib hashlib.scrypt)
    # Phase 8 knowledge base
    "pypdf",              # PDF text per page (pure Python)
    "fastembed",          # local ONNX embeddings + cross-encoder reranker, no torch
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the package of that name is third-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a real Postgres (DATABASE_URL); skipped when it is not set",
]
